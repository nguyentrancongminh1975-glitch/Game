<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Xúc Xắc Cân Bằng</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://c4.wallpaperflare.com/wallpaper/559/744/924/dragon-ball-super-ultra-instinct-son-goku-vegeta-wallpaper-preview.jpg'); /* Thay đổi URL hình nền rồng theo ý muốn */
            background-size: cover;
            background-position: center;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
        }

        .admin-info {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #ff0; /* Màu vàng */
            text-shadow: 0 0 10px #ff0, 0 0 20px #ff0, 0 0 30px #ff0, 0 0 40px #f00, 0 0 70px #f00, 0 0 80px #f00, 0 0 100px #f00, 0 0 150px #f00;
            animation: glow 1.5s ease-in-out infinite alternate;
            z-index: 1000;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #ff0, 0 0 20px #ff0;
            }
            to {
                text-shadow: 0 0 20px #ff0, 0 0 30px #ff0, 0 0 40px #f00, 0 0 70px #f00, 0 0 80px #f00, 0 0 100px #f00, 0 0 150px #f00;
            }
        }

        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            margin-top: 100px; /* Để tránh đè lên Admin info */
            width: 90%;
            max-width: 1200px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .section {
            flex: 1;
            min-width: 300px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        h1, h2 {
            text-align: center;
            color: #0ff; /* Màu xanh ngọc */
        }

        .dice-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .dice {
            width: 60px;
            height: 60px;
            background-color: #f0f8ff; /* AliceBlue */
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
            animation: roll 0.5s ease-out;
        }

        @keyframes roll {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(720deg) rotateX(720deg); }
        }

        .result-info {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .result-text {
            font-weight: bold;
            color: #ff0; /* Màu vàng */
            text-shadow: 0 0 5px #ff0;
        }

        .jackpot-text {
            font-weight: bold;
            color: #ff4500; /* OrangeRed */
            font-size: 36px;
            animation: jackpotGlow 1s infinite alternate;
        }

        @keyframes jackpotGlow {
            from { text-shadow: 0 0 10px #ff4500, 0 0 20px #ff4500; }
            to { text-shadow: 0 0 20px #ff4500, 0 0 30px #ff4500, 0 0 40px #f80; }
        }

        .timer {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            color: #0f0; /* Màu xanh lá cây */
        }

        .balance {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
        }

        .betting-section {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        .bet-options {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .bet-option {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.2s;
            border: 2px solid #0ff;
            color: #fff;
            background-color: rgba(0, 255, 255, 0.2);
            text-align: center;
            flex-grow: 1;
            margin: 0 5px;
        }

        .bet-option:hover {
            background-color: rgba(0, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .bet-option.selected {
            background-color: #0ff;
            color: #000;
            box-shadow: 0 0 15px #0ff;
        }

        .bet-amounts {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .bet-amount-btn {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            background-color: #2c3e50; /* Dark blue-gray */
            color: #fff;
            border: 1px solid #3498db;
            transition: background-color 0.3s;
        }

        .bet-amount-btn:hover {
            background-color: #34495e;
        }

        .bet-amount-btn.selected {
            background-color: #3498db;
            box-shadow: 0 0 10px #3498db;
        }

        .bet-input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .bet-input-group label {
            display: flex;
            align-items: center;
            color: #fff;
        }
        .bet-input-group input {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #0ff;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            width: 120px;
        }

        button#placeBetBtn {
            display: block;
            margin: 20px auto;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: #28a745; /* Green */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button#placeBetBtn:hover {
            background-color: #218838;
            transform: scale(1.02);
        }

        button#placeBetBtn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .history-section {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 10px;
            padding: 10px;
        }

        .history-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .win {
            color: #0f0;
        }
        .lose {
            color: #f00;
        }
        .jackpot-history {
            color: #ff4500;
            font-weight: bold;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                margin-top: 80px;
            }
            .admin-info {
                font-size: 18px;
                top: 10px;
                right: 10px;
            }
            .dice {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .bet-option {
                padding: 8px 15px;
                font-size: 16px;
            }
            .bet-amount-btn {
                padding: 8px 12px;
                font-size: 14px;
            }
            button#placeBetBtn {
                padding: 12px 25px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-info">Admin: Nguyễn Đức Thọ</div>

    <div class="container">
        <div class="section">
            <h2>Kết quả Xúc Xắc</h2>
            <div class="dice-container" id="diceContainer">
                </div>
            <div class="timer" id="timer">Tự động tung sau: 10 giây</div>
            <div class="result-info">
                Tổng điểm: <span id="totalScore">0</span> - Kết quả: <span id="resultText"></span>
                <div id="winLoseAmount" style="font-size: 18px; margin-top: 10px;"></div>
            </div>
            <div class="balance">
                Số dư: <span id="playerBalance">10.000.000 VNĐ</span>
            </div>
        </div>

        <div class="section">
            <h2>Đặt cược</h2>
            <div class="betting-section">
                <div class="bet-options" id="betOptions">
                    <div class="bet-option" data-bet-type="Gà">Gà</div>
                    <div class="bet-option" data-bet-type="Vịt">Vịt</div>
                    <div class="bet-option" data-bet-type="Ngổng">Ngổng</div>
                </div>
                <div class="bet-amounts" id="betAmounts">
                    <button class="bet-amount-btn" data-amount="100000">100K</button>
                    <button class="bet-amount-btn" data-amount="200000">200K</button>
                    <button class="bet-amount-btn" data-amount="500000">500K</button>
                </div>
                <div class="bet-input-group">
                    <label for="customBetAmount">Số tiền khác:</label>
                    <input type="number" id="customBetAmount" min="100000" step="100000" placeholder="VD: 1.000.000">
                </div>
                <button id="placeBetBtn" disabled>Đặt Cược</button>
            </div>
        </div>

        <div class="section">
            <h2>Lịch sử chơi</h2>
            <div class="history-section" id="historyLog">
                </div>
        </div>
    </div>

    <script>
        const initialBalance = 10000000; // 10 triệu VNĐ
        let playerBalance = initialBalance;
        let selectedBetType = null;
        let selectedBetAmount = 0;
        let countdownTimer;
        let timeRemaining = 10;
        let recentResults = []; // Lưu trữ kết quả của 7 lượt gần nhất
        let rollCount = 0; // Đếm số lần quay để kích hoạt nổ hũ sau 10 lần

        const diceContainer = document.getElementById('diceContainer');
        const totalScoreSpan = document.getElementById('totalScore');
        const resultTextSpan = document.getElementById('resultText');
        const winLoseAmountSpan = document.getElementById('winLoseAmount');
        const timerDisplay = document.getElementById('timer');
        const playerBalanceSpan = document.getElementById('playerBalance');
        const betOptionsContainer = document.getElementById('betOptions');
        const betAmountsContainer = document.getElementById('betAmounts');
        const customBetAmountInput = document.getElementById('customBetAmount');
        const placeBetButton = document.getElementById('placeBetBtn');
        const historyLog = document.getElementById('historyLog');

        // Hàm định dạng tiền tệ Việt Nam Đồng
        function formatCurrency(amount) {
            return amount.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' });
        }

        // Cập nhật số dư người chơi
        function updatePlayerBalance() {
            playerBalanceSpan.textContent = formatCurrency(playerBalance);
        }

        // Tạo xúc xắc
        function createDice(value) {
            const diceDiv = document.createElement('div');
            diceDiv.classList.add('dice');
            diceDiv.textContent = value;
            return diceDiv;
        }

        // Chuyển tổng điểm thành loại Gà, Vịt, Ngổng
        function getResultType(score) {
            if (score >= 10 && score <= 40) {
                return 'Gà';
            } else if (score >= 41 && score <= 69) {
                return 'Vịt';
            } else if (score >= 70 && score <= 100) { // Điều chỉnh dải điểm Ngổng
                return 'Ngổng';
            }
            return 'Không xác định'; // Trường hợp không mong muốn
        }

        // Tạo tổng điểm hợp lệ dựa trên loại kết quả mong muốn
        function generateScoreForType(type) {
            let score;
            if (type === 'Gà') {
                score = Math.floor(Math.random() * (40 - 10 + 1)) + 10;
            } else if (type === 'Vịt') {
                score = Math.floor(Math.random() * (69 - 41 + 1)) + 41;
            } else if (type === 'Ngổng') {
                score = Math.floor(Math.random() * (100 - 70 + 1)) + 70;
            } else {
                score = Math.floor(Math.random() * (100 - 10 + 1)) + 10; // Mặc định trong khoảng 10-100
            }
            return score;
        }

        // Tung xúc xắc và tính toán kết quả
        function rollDice(forceJackpot = false) {
            rollCount++;
            winLoseAmountSpan.textContent = ''; // Xóa thông báo thắng thua cũ

            let totalScore = 0;
            diceContainer.innerHTML = ''; // Xóa các xúc xắc cũ

            let resultType = '';
            let targetScore = 0;
            let currentRolls = 0;

            // --- Logic nổ hũ cưỡng chế ---
            if (forceJackpot) {
                targetScore = Math.random() < 0.5 ? 10 : 100; // Đảm bảo là 10 hoặc 100
                resultType = getResultType(targetScore);
                currentRolls = 1; // Coi đây là một lượt quay
            } else {
                // --- Logic tỉ lệ đa dạng ---
                // Bước 1: Quyết định loại kết quả mong muốn (Gà, Vịt, Ngổng)
                let desiredResultType = null;
                const availableTypes = ['Gà', 'Vịt', 'Ngổng'];

                // Kiểm tra không trùng quá 3 lần liên tiếp
                if (recentResults.length >= 3) {
                    const lastThree = recentResults.slice(-3);
                    const lastResult = lastThree[2];
                    const allSame = lastThree.every(res => res === lastResult);
                    if (allSame) {
                        // Nếu trùng 3 lần, chọn loại khác
                        const typesToAvoid = [lastResult];
                        const filteredTypes = availableTypes.filter(type => !typesToAvoid.includes(type));
                        desiredResultType = filteredTypes[Math.floor(Math.random() * filteredTypes.length)];
                    }
                }

                // Kiểm tra tổng số lần xuất hiện không quá 5 trong 7 lượt gần nhất
                if (recentResults.length >= 7 && !desiredResultType) { // Chỉ kiểm tra nếu chưa có desiredResultType từ bước trước
                    const lastSeven = recentResults.slice(-7);
                    const typeCounts = {};
                    availableTypes.forEach(type => typeCounts[type] = 0);
                    lastSeven.forEach(res => {
                        if (typeCounts[res] !== undefined) {
                            typeCounts[res]++;
                        }
                    });

                    // Tìm loại nào đã xuất hiện 5 lần
                    for (const type in typeCounts) {
                        if (typeCounts[type] >= 5) {
                            // Nếu loại này đã xuất hiện 5 lần, tránh nó
                            const typesToAvoid = [type];
                            const filteredTypes = availableTypes.filter(t => !typesToAvoid.includes(t));
                            if (filteredTypes.length > 0) {
                                desiredResultType = filteredTypes[Math.floor(Math.random() * filteredTypes.length)];
                                break; // Đã tìm được loại mong muốn
                            }
                        }
                    }
                }

                // Nếu không có ràng buộc nào, chọn ngẫu nhiên
                if (!desiredResultType) {
                    desiredResultType = availableTypes[Math.floor(Math.random() * availableTypes.length)];
                }

                // Bước 2: Tạo tổng điểm tương ứng với desiredResultType
                // Cố gắng tạo tổng điểm sao cho thuộc loại mong muốn
                totalScore = generateScoreForType(desiredResultType);

                // --- Kiểm tra nổ hũ tự nhiên ---
                if (totalScore === 10 || totalScore === 100) {
                    forceJackpot = true; // Kích hoạt hiệu ứng và tiền nổ hũ
                }
            }
            
            // Đảm bảo tổng điểm phù hợp với số xúc xắc (10-100)
            if (totalScore < 10) totalScore = 10;
            if (totalScore > 100) totalScore = 100;

            // Phân phối tổng điểm cho 10 xúc xắc
            const diceValues = [];
            let remainingScore = totalScore;
            for (let i = 0; i < 9; i++) {
                // Đảm bảo xúc xắc từ 1 đến 10 và tổng đủ cho các xúc xắc còn lại
                let maxRoll = Math.min(10, remainingScore - (9 - i)); // min(10, còn lại - (số xúc xắc chưa tung * min_value_per_dice))
                let minRoll = Math.max(1, remainingScore - (9 - i) * 10); // max(1, còn lại - (số xúc xắc chưa tung * max_value_per_dice))
                
                if (maxRoll < minRoll) { // Trường hợp đặc biệt khi min > max
                    // Điều chỉnh minRoll để không vượt quá maxRoll
                    minRoll = maxRoll; 
                }

                if (minRoll > maxRoll) { // Fallback để tránh lỗi
                    minRoll = 1;
                    maxRoll = 10;
                }

                const roll = Math.floor(Math.random() * (maxRoll - minRoll + 1)) + minRoll;
                diceValues.push(roll);
                remainingScore -= roll;
            }
            diceValues.push(remainingScore); // Xúc xắc cuối cùng nhận phần còn lại


            // Xáo trộn mảng diceValues để các số không theo thứ tự tăng dần
            for (let i = diceValues.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [diceValues[i], diceValues[j]] = [diceValues[j], diceValues[i]];
            }

            // Hiển thị xúc xắc từng cái một với hiệu ứng
            let index = 0;
            const displayInterval = setInterval(() => {
                if (index < diceValues.length) {
                    diceContainer.appendChild(createDice(diceValues[index]));
                    index++;
                } else {
                    clearInterval(displayInterval);
                }
            }, 50); // Khoảng thời gian hiển thị mỗi xúc xắc

            resultType = getResultType(totalScore); // Cập nhật resultType sau khi có totalScore cuối cùng

            totalScoreSpan.textContent = totalScore;
            resultTextSpan.textContent = resultType;
            resultTextSpan.classList.remove('jackpot-text'); // Xóa lớp nổ hũ cũ

            let winLossAmount = 0;
            let transactionClass = '';
            let historyMessage = `Xúc xắc: ${totalScore} điểm (${resultType})`;

            // Thêm kết quả vào lịch sử gần đây
            recentResults.push(resultType);
            if (recentResults.length > 7) {
                recentResults.shift(); // Giữ cho mảng chỉ có 7 phần tử gần nhất
            }

            // Xử lý cược nếu có
            if (selectedBetType && selectedBetAmount > 0) {
                if (resultType === selectedBetType) {
                    // Thắng cược
                    let multiplier = 3;
                    if (forceJackpot) { // forceJackpot bao gồm cả jackpot theo điểm và theo lượt
                        multiplier = 18 + 3; // X18 + X3
                        resultTextSpan.classList.add('jackpot-text');
                        resultTextSpan.textContent += ' (NỔ HŨ!)';
                        historyMessage += ' - NỔ HŨ!';
                    }
                    winLossAmount = selectedBetAmount * multiplier;
                    playerBalance += winLossAmount;
                    transactionClass = 'win';
                    historyMessage += ` - Cược: ${selectedBetType} (${formatCurrency(selectedBetAmount)}) - Thắng: ${formatCurrency(winLossAmount)}`;
                    winLoseAmountSpan.textContent = `+${formatCurrency(winLossAmount)}`;
                    winLoseAmountSpan.className = 'win';
                } else {
                    // Thua cược
                    winLossAmount = -selectedBetAmount;
                    playerBalance += winLossAmount;
                    transactionClass = 'lose';
                    historyMessage += ` - Cược: ${selectedBetType} (${formatCurrency(selectedBetAmount)}) - Thua: ${formatCurrency(selectedBetAmount)}`;
                    winLoseAmountSpan.textContent = `-${formatCurrency(selectedBetAmount)}`;
                    winLoseAmountSpan.className = 'lose';
                }
            } else {
                winLoseAmountSpan.textContent = ''; // Xóa thông báo nếu không có cược
            }


            updatePlayerBalance();
            addHistory(historyMessage, transactionClass);

            // Reset lựa chọn cược sau mỗi lần tung
            selectedBetType = null;
            selectedBetAmount = 0;
            updateBettingUI();
            placeBetButton.disabled = true; // Vô hiệu hóa nút đặt cược sau khi tung
        }

        // Thêm lịch sử vào bảng
        function addHistory(message, type = '') {
            const historyItem = document.createElement('div');
            historyItem.classList.add('history-item');
            if (type) {
                historyItem.classList.add(type);
            }
            historyItem.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            historyLog.prepend(historyItem); // Thêm vào đầu danh sách
            if (historyLog.children.length > 50) { // Giới hạn số lượng lịch sử
                historyLog.removeChild(historyLog.lastChild);
            }
        }

        // Bắt đầu đếm ngược thời gian
        function startCountdown() {
            clearInterval(countdownTimer);
            timeRemaining = 10;
            timerDisplay.textContent = `Tự động tung sau: ${timeRemaining} giây`;
            countdownTimer = setInterval(() => {
                timeRemaining--;
                timerDisplay.textContent = `Tự động tung sau: ${timeRemaining} giây`;
                if (timeRemaining <= 0) {
                    // Kiểm tra nếu là lượt thứ 10 thì force jackpot
                    const shouldForceJackpot = (rollCount + 1) % 10 === 0; // +1 vì rollCount sẽ tăng sau khi rollDice được gọi
                    rollDice(shouldForceJackpot);
                    timeRemaining = 10; // Reset thời gian
                    timerDisplay.textContent = `Tự động tung sau: ${timeRemaining} giây`;
                }
            }, 1000);
        }

        // Xử lý chọn loại cược (Gà, Vịt, Ngổng)
        betOptionsContainer.addEventListener('click', (event) => {
            const target = event.target;
            if (target.classList.contains('bet-option')) {
                // Xóa lớp 'selected' khỏi tất cả các tùy chọn
                document.querySelectorAll('.bet-option').forEach(btn => btn.classList.remove('selected'));
                // Thêm lớp 'selected' vào tùy chọn được click
                target.classList.add('selected');
                selectedBetType = target.dataset.betType;
                checkCanPlaceBet();
            }
        });

        // Xử lý chọn số tiền cược (100k, 200k, 500k)
        betAmountsContainer.addEventListener('click', (event) => {
            const target = event.target;
            if (target.classList.contains('bet-amount-btn')) {
                // Xóa lớp 'selected' khỏi tất cả các nút số tiền
                document.querySelectorAll('.bet-amount-btn').forEach(btn => btn.classList.remove('selected'));
                // Thêm lớp 'selected' vào nút được click
                target.classList.add('selected');
                selectedBetAmount = parseInt(target.dataset.amount);
                customBetAmountInput.value = ''; // Xóa giá trị custom nếu chọn nút có sẵn
                checkCanPlaceBet();
            }
        });

        // Xử lý nhập số tiền cược tùy chỉnh
        customBetAmountInput.addEventListener('input', (event) => {
            const value = parseInt(event.target.value);
            if (!isNaN(value) && value > 0 && value % 100000 === 0) { // Số tiền bất kỳ, nhưng là bội số của 100k
                selectedBetAmount = value;
                // Xóa lớp 'selected' khỏi tất cả các nút số tiền cố định
                document.querySelectorAll('.bet-amount-btn').forEach(btn => btn.classList.remove('selected'));
            } else {
                selectedBetAmount = 0; // Đặt về 0 nếu không hợp lệ
            }
            checkCanPlaceBet();
        });

        // Kiểm tra xem có thể đặt cược hay không
        function checkCanPlaceBet() {
            if (selectedBetType && selectedBetAmount > 0 && selectedBetAmount <= playerBalance) {
                placeBetButton.disabled = false;
            } else {
                placeBetButton.disabled = true;
            }
        }

        // Cập nhật giao diện đặt cược (ví dụ: xóa lựa chọn)
        function updateBettingUI() {
            document.querySelectorAll('.bet-option').forEach(btn => btn.classList.remove('selected'));
            document.querySelectorAll('.bet-amount-btn').forEach(btn => btn.classList.remove('selected'));
            customBetAmountInput.value = '';
        }

        // Xử lý nút đặt cược
        placeBetButton.addEventListener('click', () => {
            if (selectedBetType && selectedBetAmount > 0) {
                if (selectedBetAmount > playerBalance) {
                    alert('Số tiền đặt cược lớn hơn số dư của bạn!');
                    return;
                }
                alert(`Bạn đã đặt cược ${formatCurrency(selectedBetAmount)} vào "${selectedBetType}". Chờ kết quả!`);
                placeBetButton.disabled = true; // Vô hiệu hóa nút đặt cược sau khi đã đặt
                // Lưu ý: Không cần gọi rollDice() ở đây vì nó sẽ tự động chạy sau 10s
            } else {
                alert('Vui lòng chọn loại cược và số tiền cược hợp lệ.');
            }
        });

        // Khởi tạo trò chơi
        document.addEventListener('DOMContentLoaded', () => {
            updatePlayerBalance();
            rollDice(); // Tung xúc xắc lần đầu tiên
            startCountdown(); // Bắt đầu đếm ngược
        });

    </script>
</body>
</html>
